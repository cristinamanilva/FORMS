<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Doble</title>
    <link rel="stylesheet" href="estilos/estilos.css">
</head>
<body>
    <header>
        <h1>Formulario Doble</h1>
    </header>

    <nav>
        <input form="f-datos" type="submit" value="ENVIAR DATOS">
        <input form="f-pedido" type="submit" value="ENVIAR PEDIDO">
    </nav>

    <main>
        <form  id="f-datos" action="#" method="get">
            <h2>Log In</h2>

            <fieldset>
                <legend>Datos del Usuario</legend>
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" name="usuario"
                placeholder="Escriba su usuario" required>
                <label for="contraseña">Contraseña:</label>
                <input type="password" id="contraseña" 
                name="contraseña" placeholder="Escriba su contraseña"
                pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" 
                title="La contraseña debe contener al menos una letra mayúscula, una letra minúscula, un número y tener al menos 8 caracteres">
            </fieldset>
        </form>
    
        <form id="f-pedido" action="#" method="get">
            <h2>Realizar Pedido</h2>
            <fieldset>
                <legend>Pedido</legend>
                <section>
                    <article>
                        <div>
                            <label for="producto">Producto:</label>
                            <input type="text" id="producto" name="producto">
                        </div>
                        <div>
                            <label for="cantidad">Cantidad:</label>
                            <input type="number" id="cantidad" name="cantidad" min="1">
                        </div>
                    </article>

                    <div>
                        <label for="colores">Colores:</label>
                        <article>
                            <input type="radio" name="colores" id="rojo">
                            <label for="rojo">Rojo</label>
                        </article>
                        <article>
                            <input type="radio" name="colores" id="azul">
                            <label for="azul">Azul</label>
                        </article>
                        <article>
                            <input type="radio" name="colores" id="verde">
                            <label for="verde">Verde</label>
                        </article>
                        <article>
                            <input type="radio" name="colores" id="amarillo">
                            <label for="amarillo">Amarillo</label>
                        </article>
                    </div>
                </section>
                <section>
                    <article>
                        <div>
                            <label for="producto">Producto:</label>
                            <input type="text" id="producto" name="producto">
                        </div>
                        <div>
                            <label for="cantidad">Cantidad:</label>
                            <input type="number" id="cantidad" name="cantidad" min="1">
                        </div>
                    </article>

                    <div>
                        <label for="colores2">Colores:</label>
                        <article>
                            <input type="radio" name="colores2" id="rojo">
                            <label for="rojo">Rojo</label>
                        </article>
                        <article>
                            <input type="radio" name="colores2" id="azul">
                            <label for="azul">Azul</label>
                        </article>
                        <article>
                            <input type="radio" name="colores2" id="verde">
                            <label for="verde">Verde</label>
                        </article>
                        <article>
                            <input type="radio" name="colores2" id="amarillo">
                            <label for="amarillo">Amarillo</label>
                        </article>
                    </div>
                </section>
               
            </fieldset>
        </form>
    </main>

</body>
</html>
